name: First CI Pipeline

on:
  push:
  pull_request:

jobs:
  check-project:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Starting project checks..."

          for file in README.md app/index.html app/server-health.sh; do
            if [ -f "$file" ]; then
              echo "PASS: $file exists"
            else
              echo "FAIL: $file is missing"
              exit 1
            fi
          done

          echo "All required files exist!"

      - name: Check Bash syntax
        run: bash -n app/server-health.sh

      - name: Run ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck app/server-health.sh
